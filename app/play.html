<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/art/icons/taxi.png" />
    <link rel="preload" href="/fonts/BurbankSmall-Bold.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/BurbankSmall-Medium.otf" as="font" type="font/otf" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Club NYC: a city you can hang out in</title>
    <!-- the game page is an empty shell until it boots: search engines index the landing page (/) instead -->
    <meta name="robots" content="noindex" />
    <meta name="description" content="A cozy online New York you can hang out in. Make a New Yorker in 30 seconds, work silly jobs, decorate your apartment and meet your friends in Times Square." />
    <meta name="theme-color" content="#0b1835" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Club NYC" />
    <meta property="og:title" content="Club NYC: a city you can hang out in" />
    <meta property="og:description" content="A cozy online New York. Make a New Yorker in 30 seconds, work silly jobs, decorate your apartment and meet your friends in Times Square." />
    <meta property="og:image" content="/og/club-nyc.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Club NYC: a city you can hang out in" />

  </head>
  <body>
    <!-- the page around the game (src/shell.ts): hidden in full screen -->
    <header class="shell-bar">
      <a class="shell-brand" href="/" aria-label="Club NYC home"><img src="/art/ui/logo.png" alt="Club NYC" width="900" height="507" /></a>
      <nav class="shell-nav" aria-label="Site">
        <a href="/">Home</a>
        <a href="/help/" target="_blank" rel="noopener">Help</a>
        <a href="/help/whats-new/" target="_blank" rel="noopener">What’s New</a>
        <a href="/rules.html" target="_blank" rel="noopener">Rules</a>
        <a href="/community" target="_blank" rel="noopener">Community</a>
      </nav>
      <div class="shell-tools">
        <div class="shell-lang" translate="no">
          <button class="shell-lang-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Language">
            <svg class="globe" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c3 3.2 3 14.800 0 18M12 3c-3 3.2-3 14.800 0 18" /></g></svg>
            <span class="shell-lang-name">English</span>
            <svg class="chev" viewBox="0 0 12 8" aria-hidden="true"><path d="M1.500 1.500 6 6l4.500-4.500" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <ul class="shell-lang-menu" role="listbox" aria-label="Language" hidden></ul>
        </div>
        <button class="shell-full" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg><span>Full Screen</span></button>
      </div>
    </header>
    <main class="shell-main"><div id="app"></div></main>
    <button class="shell-exit" type="button" aria-label="Exit Full Screen" title="Exit Full Screen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
