<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Photo match lab</title>
    <style>
      body { margin: 0; padding: 8px; background: #eef; font: 11px ui-monospace, monospace; }
      #out { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .row { display: flex; gap: 6px; align-items: flex-start; background: #fff; border-radius: 10px; padding: 6px; }
      .row canvas { width: 110px; height: 130px; object-fit: cover; object-position: top; border-radius: 6px; }
      .row svg { width: 110px; height: 114px; background: #cfe8ff; border-radius: 8px; }
      pre { display: none; }
    </style>
  </head>
  <body>
    <div id="out">loading…</div>
    <script type="module" src="./match.ts"></script>
  </body>
</html>
